[package]
name = "music-api"
version = "0.1.0"
edition = "2024"

[dependencies]
progenitor-client = "0.15"
reqwest = { version = "0.13", features = ["json", "query", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
regress = "0.12"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
tokio = { version = "1", features = ["time", "net", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
progenitor = { version = "0.15", default-features = false }
openapiv3 = "2.2"
serde_json = "1"
syn = "3.0.2"
prettyplease = "0.3.0"
